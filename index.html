<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:'M PLUS Rounded 1c',system-ui,sans-serif;font-weight:800;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.st{color:#fff;-webkit-text-stroke:4px #151515;paint-order:stroke fill}
#hud{position:fixed;inset:0;pointer-events:none}

.b{border:3px solid #151515;border-radius:18px;background:linear-gradient(#ffd34d,#ff9f1c);box-shadow:0 4px 0 #151515;font:inherit;font-size:18px;color:#fff;-webkit-text-stroke:4px #151515;paint-order:stroke fill;padding:8px 14px;transition:transform .08s,filter .08s}
.b:active{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 #151515;filter:brightness(1.15)}
.b.g{background:linear-gradient(#7be36b,#2fae3f)}.b.r{background:linear-gradient(#ff7a7a,#d9342f)}.b.c{background:linear-gradient(#6fd6ff,#2a8ae0)}
#bMenu{left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));width:56px;height:56px;font-size:26px;padding:0}
#top{left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center;pointer-events:none;line-height:1.15}

#durw{width:110px;height:12px;border:3px solid #151515;border-radius:8px;background:#333;overflow:hidden;margin-top:3px}

#knob{position:absolute;left:38px;top:38px;width:60px;height:60px;border-radius:50%;background:#fff;border:3px solid #151515;pointer-events:none}

#bTool{right:calc(116px + env(safe-area-inset-right));bottom:calc(132px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;font-size:28px;padding:0}
#tools{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.tl{width:60px;height:60px;border-radius:16px;font-size:26px;padding:0;opacity:.6}.tl.on{opacity:1;filter:brightness(1.1);outline:4px solid #fff}
#bCol{left:50%;transform:translateX(-50%);bottom:calc(250px + env(safe-area-inset-bottom));font-size:26px;padding:12px 30px;animation:pop .6s infinite alternate}
@keyframes pop{to{scale:1.08}}
#bRep{left:50%;transform:translateX(-50%);bottom:calc(320px + env(safe-area-inset-bottom));font-size:22px}

#menu,#title,#rew{position:fixed;inset:0;display:none;z-index:5}

#tabs{display:flex;gap:8px;margin-bottom:12px}#tabs .b{flex:1;font-size:13px;padding:8px 2px}.in{font:inherit;-webkit-text-stroke:0;color:#111;width:110px;padding:6px;border-radius:10px;border:3px solid #151515}#emo{display:none;flex-direction:column;gap:6px;right:calc(24px + env(safe-area-inset-right));bottom:calc(250px + env(safe-area-inset-bottom))}#emo.show{display:flex}#bEm{right:calc(30px + env(safe-area-inset-right));bottom:calc(184px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;padding:0;font-size:24px}

.cd{border:4px solid;border-radius:16px;background:#2c2760;padding:8px;font-size:14px;min-height:110px}
.cd b{font-size:17px;display:block}.cd small{display:block;-webkit-text-stroke:0;font-weight:700;color:#cdd;line-height:1.35}
.sw{height:34px;border-radius:10px;margin-bottom:6px;border:3px solid #151515}
.up{display:flex;justify-content:space-between;align-items:center;border:4px solid #151515;border-radius:16px;background:#2c2760;padding:10px;margin-bottom:10px}

#title{background:radial-gradient(#4a6cff,#1b1550);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:9;display:flex}
#title h1{font-size:46px;margin:0;line-height:1;-webkit-text-stroke:8px #151515}

@media(min-width:700px){#grid{grid-template-columns:repeat(4,1fr)}}
#lv{left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));pointer-events:none;font-size:16px;width:118px}
#xpw{height:11px;border:3px solid #151515;border-radius:8px;background:#333;overflow:hidden}#xp{height:100%;background:#4aa8ff;width:0;transition:width .3s}
#res{left:calc(12px + env(safe-area-inset-left));right:auto;top:calc(54px + env(safe-area-inset-top));text-align:left;font-size:15px;line-height:1.2}
#cargo{top:calc(112px + env(safe-area-inset-top))}
#mm{right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:112px;height:112px;border-radius:50%;border:4px solid #151515;background:#223;pointer-events:none;box-shadow:0 3px 0 #151515}
#dock{right:calc(14px + env(safe-area-inset-right));top:calc(134px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px}
.dk{width:44px;height:44px;border-radius:14px;padding:0;font-size:22px;opacity:.85}
#bAct{left:50%;transform:translateX(-50%);bottom:calc(312px + env(safe-area-inset-bottom));font-size:22px;animation:pop .6s infinite alternate}
#top{top:calc(10px + env(safe-area-inset-top))}
#emo{flex-direction:row;right:calc(88px + env(safe-area-inset-right));bottom:calc(184px + env(safe-area-inset-bottom))}
#modal{position:fixed;inset:0;display:none;z-index:5;background:rgba(10,8,30,.5);align-items:center;justify-content:center}#modal.on{display:flex}
#mp{width:min(94vw,440px);max-height:76vh;overflow:auto;background:#2a2560;border:4px solid #151515;border-radius:24px;padding:12px;animation:pin .22s cubic-bezier(.2,1.5,.4,1);touch-action:pan-y;box-shadow:0 8px 0 #151515}
@keyframes pin{from{transform:scale(.6);opacity:0}}
#mh{display:flex;justify-content:space-between;align-items:center;font-size:22px;margin-bottom:10px;position:sticky;top:-12px;background:#2a2560;padding:6px 0;z-index:1}
.sm{font-size:13px;-webkit-text-stroke:0;font-weight:700;color:#cdd;line-height:1.4}
.up .b{font-size:15px;padding:6px 10px}

/* ===== HUD v3 ===== */

#lcol #cargo{position:static;left:auto;top:auto;padding:6px 8px 7px;border-radius:14px;font-size:12px;line-height:1.1;display:flex;flex-direction:column;gap:3px;pointer-events:none}

#hud #top{left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));padding:4px 10px 5px;border-radius:14px;max-width:108px;min-width:84px;text-align:center}
#area{font-size:15px;line-height:1.15}#clock{font-size:12px;line-height:1.15}
#hud #gd{top:calc(76px + env(safe-area-inset-top));width:clamp(108px,calc(100vw - 330px),230px);padding:5px 8px;border-radius:12px;font-size:12px;line-height:1.3;transform:translateX(-50%);box-shadow:0 3px 0 #151515}

#hud #mm{left:auto;bottom:auto;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:var(--mm);height:var(--mm);border:4px solid #ffd34d;border-radius:50%;background:#223;pointer-events:none;box-shadow:0 0 0 3px #151515,0 5px 0 3px #151515,inset 0 0 14px rgba(0,0,0,.6)}

#hud #bEm{right:calc(30px + env(safe-area-inset-right));bottom:calc(190px + env(safe-area-inset-bottom));width:46px;height:46px;font-size:21px}
#hud #emo{right:calc(30px + env(safe-area-inset-right));bottom:calc(244px + env(safe-area-inset-bottom))}
#hud #tools{left:calc(14px + env(safe-area-inset-left));transform:none;bottom:calc(14px + env(safe-area-inset-bottom));gap:6px}#hud .tl{width:48px;height:48px;font-size:21px}
#hud #bCol{bottom:calc(150px + env(safe-area-inset-bottom));font-size:19px;padding:8px 20px}

canvas#c{inset:0 auto 0 50%;width:min(100vw,56.25vh);transform:translateX(-50%)}

window.diagH=()=>{let h=`<div style="color:#ff9b9b;font-size:13px;-webkit-text-stroke:0;font-weight:700;line-height:1.5">サーバーに接続できません${diagT()}</div>`;
 if(DG)h+=`<div style="font-size:12px;-webkit-text-stroke:0;font-weight:700;line-height:1.6;color:#fff">${DG.map(l=>E(l)).join('<br>')}</div>`;
 return h+'<div class="up"><div>接続診断<br><span class="sm">各テーブルを順に確認します</span></div><button class="b c" data-a="diag">診断する</button></div>'};
NA.diag=async()=>{DG=['診断中…'];if($('modal').classList.contains('on'))tab(curTab);const out=[];
 for(const t of ['profiles','friends','trades']){try{const r=await fetch(SBU+t+'?select=*&limit=1',{headers:{apikey:SBK}});if(r.ok)out.push('✅ '+t+' 読み取りOK');else{let j={};try{j=await r.json()}catch(_){}out.push('❌ '+t+' '+r.status+' '+(j.code||'')+' '+(j.message||'')+' → '+(why({st:r.status,code:j.code})||''))}}catch(e){out.push('❌ '+t+' 通信失敗 → '+why({st:0}))}}
 try{const r=await sb('profiles?on_conflict=id','POST',{id:S.uid,code:S.code,name:S.name,lv:S.lv,updated_at:new Date().toISOString()},'resolution=merge-duplicates,return=minimal');out.push(r?'✅ profiles 書き込みOK':'❌ profiles 書き込み失敗 '+(SBL?SBL.st+' '+SBL.code+' '+SBL.msg:''))}catch(e){out.push('❌ profiles 書き込み失敗')}
 DG=out;if($('modal').classList.contains('on'))tab(curTab)};
})();

/* ===== B17: tag dex cards with their rarity (drives the frame styles) ===== */
(()=>{
const RGB=RC.map(c=>{const n=parseInt(c.slice(1),16);return `rgb(${n>>16}, ${(n>>8)&255}, ${n&255})`});
const prev=tab;
tab=function(t){const r=prev(t);
 if(t=='dex'){const m=$('mc'),cs=[...m.querySelectorAll('.cd')];
  cs.forEach((c,i)=>{let k=RGB.indexOf(c.style.borderColor);if(k<0&&cs.length==SP.length&&SP[i])k=SP[i].r;if(k>=0)c.dataset.rf=k});
  if(!m.querySelector('#rleg'))m.insertAdjacentHTML('afterbegin',`<div id="rleg">${RN.map((n,i)=>`<span class="rchip" data-rf="${i}">${n}</span>`).join('')}</div><div class="sm" style="margin:-6px 0 10px">枠でレア度がわかる：銀＝Common／緑＝Uncommon／青く光る＝Rare／しましま＝Epic／金色に輝く＝Legendary／ゆっくり色が変わる＝Mythic／虹色＝Secret</div>`)}
 return r};
})();

/* ===== B18: notifications / friend-world invites / auto reload ===== */
(()=>{
const APPV='B18',AR_MS=300000;
try{const u=new URL(location.href);if(u.searchParams.has('r')){u.searchParams.delete('r');history.replaceState(null,'',u.pathname+u.search+u.hash)}}catch(e){}
const UPD=[
 {id:18,t:'B18 通知タブ・フレンド招待・自動リロード',d:'通知タブを追加（アプデ報告／フレンド申請／ワールド招待）。5分以上アプリを開かないと自動で最新版にリロードします。招待された世界から「自分の世界へ戻る」ボタンで戻れます。'},
 {id:17,t:'B17 図鑑の枠がレア度で変化',d:'銀→緑→青く光る→しましま→金色に輝く→ゆっくり色が変わる→虹色。枠だけでレア度がわかります。'},
 {id:16,t:'B16 サーバー接続の診断',d:'フレンド／交換メニューに「診断する」を追加。失敗の理由が表示されます。'},
 {id:14,t:'B14 新エリア・新施設・新キャラ',d:'虹のネオン遊園地(Lv48)、ランキング塔・整備工場・ラッキーくじ・カフェ・ぎんこう、新キャラ30体を追加。'},
 {id:13,t:'B13 ポップな見た目に刷新',d:'ステージ装飾、虹のアーチ、風船、ボタンUIをリニューアル。'}];
const E=x=>String(x==null?'':x).replace(/[<>&"']/g,'');
const ago=iso=>{const m=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));return m<1?'たった今':m<60?m+'分前':Math.round(m/60)+'時間前'};
const sbq=async(p,m='GET',b,pf)=>{try{const r=await fetch(SBU+p,{method:m,headers:{apikey:SBK,'Content-Type':'application/json',Prefer:pf||'return=representation'},body:b?JSON.stringify(b):undefined});if(!r.ok){let j={};try{j=await r.json()}catch(_){}return{err:r.status,code:j.code||''}}const t=await r.text();return t?JSON.parse(t):[]}catch(e){return{err:0}}};
let INV=[],NTC=[],GW=null,ERR='',SENT=new Set(),snap={u:0,s:0},ntOpen=false;
Object.assign(TT,{notif:'🔔 通知',invite:'📨 友達を招待'});

/* ---------- badge on dock ---------- */
const btn=document.createElement('button');btn.className='b c dk';btn.dataset.t='notif';btn.innerHTML='<i>🔔</i><span>🔔通知</span>';
const bdg=document.createElement('i');bdg.className='nbdg';btn.appendChild(bdg);btn.onpointerdown=()=>openMenu('notif');$('dock').prepend(btn);
const unreadU=()=>UPD.filter(u=>u.id>(S.nSeen|0)).length+NTC.filter(n=>n.id>(S.nSrv|0)).length;
const total=()=>unreadU()+FR.pend.length+INV.length;
let sig='';
function refresh(){const n=total();bdg.textContent=n>9?'9+':n;bdg.classList.toggle('on',n>0);
 const s=INV.map(x=>x.id).join()+'|'+FR.pend.join()+'|'+NTC.length;
 if(s!==sig){sig=s;if(ntOpen&&curTab=='notif'&&$('modal').classList.contains('on')&&!(document.activeElement&&document.activeElement.tagName=='INPUT'))tab('notif')}}
setInterval(()=>{if(!$('modal').classList.contains('on')||curTab!='notif')ntOpen=false;refresh()},1500);

/* ---------- polling invites / server notices ---------- */
let skip=0,fails=0,first=1,pnc=0;const seenInv=new Set();
async function pollN(){if(document.hidden)return;if(skip>0){skip--;return}
 const since=encodeURIComponent(new Date(Date.now()-30*60000).toISOString());
 const iv=await sbq(`invites?to_id=eq.${S.uid}&status=eq.open&created_at=gt.${since}&order=id.desc&limit=10&select=*`);
 if(Array.isArray(iv)){fails=0;ERR='';INV=iv.filter(x=>x.room);iv.forEach(x=>{if(!seenInv.has(x.id)){seenInv.add(x.id);if(!first){toast(`📨 ${x.from_name||'フレンド'} から世界への招待！（通知タブ）`);arp([659,880,1175,1568])}}})}
 else{ERR=iv.err+(iv.code?' '+iv.code:'');fails=Math.min(fails+1,6);skip=fails*2}
 if(first||(pnc++%5==0)){const nt=await sbq('notices?select=id,title,body,created_at&order=id.desc&limit=10');if(Array.isArray(nt))NTC=nt}
 first=0;refresh()}
setInterval(pollN,8000);setTimeout(pollN,2500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(pollN,300)});

/* ---------- join / leave a friend's world ---------- */
function gotoHost(silent){const r=RP[net.hostId];if(!r){if(!silent)toast('ホストの位置がまだわかりません');return}
 const t=r.tg,z=t.x>800?Math.round(t.x/500)+1:0,x=t.x+3,zz=t.z+3;
 if(z!=curZ)warp(z,x,zz);else{P.pos.set(x,H(x,zz)+.1,zz);P.vy=0;cp.set(x,0,zz+4)}}
function restore(g){if(vis)leaveVisit();CR.forEach(c=>scene.remove(c.h));CR=[];
 if(g.z!=curZ)warp(g.z,g.x,g.pz);else{P.pos.set(g.x,H(g.x,g.pz)+.1,g.pz);P.vy=0;cp.set(g.x,0,g.pz+4)}
 for(let i=0;i<8;i++)spawnC();banner('自分の世界へ戻りました','#fff');arp([523,659])}
const _ln=leaveNet;
leaveNet=function(){const g=GW,wasHost=net.host;GW=null;_ln();if(wasHost)sbq(`invites?from_id=eq.${S.uid}&status=eq.open`,'PATCH',{status:'closed'});if(g)restore(g)};
function joinByCode(code,name){if(net.on||net.peer)leaveNet();nameIn();
 const pr=net.peer=new Peer();
 pr.on('open',id=>{net.me=id;net.hostId='cto-'+code;const c=pr.connect(net.hostId);
  c.on('open',()=>{net.hc=c;net.on=1;GW={host:name||'フレンド',code,z:curZ,x:P.pos.x,pz:P.pos.z};banner((name||'フレンド')+' の世界へ！','#ffd34d');arp([523,659,784]);setTimeout(()=>gotoHost(true),1600)});
  c.on('data',handle);c.on('close',()=>{toast('世界が閉じられました');leaveNet()})});
 pr.on('error',()=>{toast('接続できません（部屋が閉じたかも）');leaveNet()})}

/* ---------- top pill: where am I / go back ---------- */
const gw=document.createElement('div');gw.id='gw';$('hud').appendChild(gw);let gk='';
gw.onpointerdown=e=>{const a=e.target.closest('[data-g]');if(!a)return;const k=a.dataset.g;
 if(k=='home')leaveNet();else if(k=='near')gotoHost();else if(k=='inv')openMenu('invite');else if(k=='close')leaveNet()};
setInterval(()=>{if(!net.on){gw.style.display='none';gk='';return}
 const n=Object.keys(RP).length+1,host=!!net.host,k=(host?'h':'g')+n+(GW?GW.host:'');
 gw.style.top=vis?'calc(194px + env(safe-area-inset-top))':'calc(134px + env(safe-area-inset-top))';gw.style.display='flex';
 if(k===gk)return;gk=k;
 gw.innerHTML=host?`<span>🏠 あなたの世界 ・${n}人</span><div class="r2"><button class="b g" data-g="inv">招待</button><button class="b r" data-g="close">閉じる</button></div>`
  :`<span>🌐 ${E(GW?GW.host:'フレンド')}の世界 ・${n}人</span><div class="r2"><button class="b c" data-g="near">そばへ</button><button class="b r" data-g="home">自分の世界へ戻る</button></div>`},400);

/* ---------- tabs ---------- */
const prev=tab;
tab=function(t){
 if(t!='notif'&&t!='invite')return prev(t);
 curTab=t;$('mt').textContent=TT[t];const m=$('mc');let h='';
 if(t=='notif'){
  if(!ntOpen){snap={u:S.nSeen|0,s:S.nSrv|0};ntOpen=true}
  h+=H2('友達を世界に招待<br>'+SM(net.host?'あなたの世界に友達を呼べます':'部屋を作ると友達を呼べます'),B2('招待','n_inv',null,null,'g'));
  h+=`<div class="ntH">📨 世界への招待 (${INV.length})</div>`;
  h+=INV.length?INV.map(x=>H2(`${E(x.from_name||'フレンド')} があなたを招待<br>${SM(ago(x.created_at)+' ・ 部屋 '+E(x.room))}`,B2('参加','n_join',x.id,null,'g')+' '+B2('無視','n_ign',x.id,null,'r'))).join(''):'<div class="sm ntE">招待はありません</div>';
  h+=`<div class="ntH">🤝 フレンド申請 (${FR.pend.length})</div>`;
  h+=FR.pend.length?FR.pend.map(id=>H2(`${E(nmP(id))} から申請`,B2('承認','fok',id)+' '+B2('却下','fno',id,null,'r'))).join(''):'<div class="sm ntE">申請はありません</div>';
  h+='<div class="ntH">📢 お知らせ</div>';
  h+=NTC.map(n=>H2(`<b>${E(n.title)}</b>${n.id>snap.s?'<span class="nw">NEW</span>':''}<br>${SM(E(n.body))}`,'')).join('');
  h+=UPD.map(u=>H2(`<b>${E(u.t)}</b>${u.id>snap.u?'<span class="nw">NEW</span>':''}<br>${SM(E(u.d))}`,'')).join('');
  h+=`<div class="ntH">⚙ 設定</div>`+H2(`自動リロード<br>${SM('5分以上開かなかったら最新版を読み込みます')}`,B2(S.noAR?'OFF':'ON','n_ar',null,null,S.noAR?'r':'g'));
  h+=`<div class="sm ntE">${APPV}${ERR?' ／ 招待サーバー: '+E(ERR)+'（招待機能はSQLの再実行が必要かも）':''}</div>`;
  S.nSeen=Math.max(S.nSeen|0,...UPD.map(u=>u.id));S.nSrv=Math.max(S.nSrv|0,...NTC.map(n=>n.id));save();
 }else{
  const n=Object.keys(RP).length+1;
  if(!net.host)h+=H2('まだ部屋がありません<br>'+SM('部屋を作ると、友達があなたの世界に参加できます'),B2('部屋を作る','i_host',null,null,'g'));
  else{h+=H2(`🏠 あなたの世界 ・${n}人<br>${SM('部屋コード '+E(net.me.slice(4))+' ／ 招待は30分有効')}`,B2('閉じる','i_close',null,null,'r'));
   h+=FR.fs.length?FR.fs.map(id=>H2(`${E(nmP(id))} <small class="sm">Lv${FR.prof[id]?FR.prof[id].lv:'?'}</small>`,B2(SENT.has(id)?'送信済み':'招待','i_send',id,null,SENT.has(id)?'c':'g'))).join(''):'<div class="sm ntE">フレンドがいません（フレンド画面で追加）</div>'}
 }
 m.innerHTML=h;
 m.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a,v=b.dataset.v;
  if(a=='fok'||a=='fno'){await NA[a](v);refresh();tab(t);return}
  if(a=='n_inv'){openMenu('invite');return}
  if(a=='n_ar'){S.noAR=S.noAR?0:1;save();tab(t);return}
  if(a=='n_join'){const x=INV.find(q=>q.id==v);if(!x)return;sbq(`invites?id=eq.${v}`,'PATCH',{status:'accepted'});INV=INV.filter(q=>q.id!=v);closeM();refresh();joinByCode(x.room,x.from_name);return}
  if(a=='n_ign'){sbq(`invites?id=eq.${v}`,'PATCH',{status:'declined'});INV=INV.filter(q=>q.id!=v);refresh();tab(t);return}
  if(a=='i_host'){if(net.on)return toast('すでに参加中です');hostRoom();setTimeout(()=>{if(net.host&&$('modal').classList.contains('on'))tab('invite')},1500);return}
  if(a=='i_close'){leaveNet();tab(t);return}
  if(a=='i_send'){if(!net.host||!net.me)return;const r=await sbq('invites','POST',{from_id:S.uid,to_id:v,room:net.me.slice(4),from_name:S.name,status:'open'});
   if(Array.isArray(r)){SENT.add(v);toast('招待を送った！');arp([659,880])}else toast('送信失敗'+(r.err?'（'+r.err+'：SQLを再実行してください）':''));tab(t)}})};

/* ---------- auto reload after 5 min away ---------- */
let hid=0,lastT=Date.now(),reloading=false;
const doReload=()=>{if(reloading||S.noAR||navigator.onLine===false)return;reloading=true;save();
 const o=document.createElement('div');o.id='arov';o.textContent='🔄 最新版を読み込み中…';document.body.appendChild(o);
 setTimeout(()=>{try{const u=new URL(location.href);u.searchParams.set('r',Date.now());location.replace(u.toString())}catch(e){location.reload()}},400)};
document.addEventListener('visibilitychange',()=>{if(document.hidden){hid=Date.now();save()}else{if(hid&&Date.now()-hid>=AR_MS)doReload();hid=0;lastT=Date.now()}});
addEventListener('pagehide',()=>{hid=Date.now();save()});
addEventListener('pageshow',()=>{if(hid&&Date.now()-hid>=AR_MS)doReload();hid=0;lastT=Date.now()});
setInterval(()=>{const n=Date.now();if(!document.hidden&&n-lastT>AR_MS)doReload();lastT=n},5000);
})();
requestAnimationFrame(loop);
</script></body></html>
